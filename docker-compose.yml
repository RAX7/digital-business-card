services:
  api:
    build:
      context: ./
    container_name: nestjs
    env_file:
      - ./.env
    ports:
      - '3000:3000'
    volumes:
      - ./:/home/node/app
    depends_on:
      - apidb

  apidb:
    image: postgres:18.6
    restart: unless-stopped
    container_name: postgres
    env_file:
      - ./.env
    ports:
      - '5432:5432'
    volumes:
      - ./__docker/apidb:/var/lib/postgresql/data/pgdata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
